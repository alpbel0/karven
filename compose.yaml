name: karven

# ---------------------------------------------------------------------------
# Phase profiles: only the services the current phase needs start by default.
#   default (no profile) : postgres, minio, migrator, api, core-scheduler  (now)
#   graph                : neo4j                            (Phase 3 — graph agent)
#   queue                : redis, worker, beat              (Task 1.5 / 1.7)
#   web                  : frontend                         (Phase 4-5)
# Enable a group via COMPOSE_PROFILES (e.g. COMPOSE_PROFILES=graph,queue) or
# `docker compose --profile graph up -d`. Enabling `graph` also requires
# NEO4J_ENABLED=true so the migrator applies graph migrations.
# ---------------------------------------------------------------------------
# Shared configuration for backend application services.
# Every backend service uses the same image built from ./backend; only the
# command differs. The root .env is loaded for secrets (copy .env.example to
# .env and fill the passwords first; infra services refuse to start without
# them), then in-network addresses OVERRIDE the host-side defaults from .env.
# ---------------------------------------------------------------------------
x-infra-deps: &infra-deps
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  # Profiled services: ignored unless the matching profile is enabled. When the
  # profile IS enabled they are started and awaited normally (required: false
  # only relaxes the "service must exist" requirement).
  neo4j:
    condition: service_healthy
    required: false
  redis:
    condition: service_healthy
    required: false

# Application services start only after the one-shot migrator succeeds.
x-app-deps: &app-deps
  <<: *infra-deps
  migrator:
    condition: service_completed_successfully

x-backend-base: &backend-base
  image: karven-backend:${BACKEND_IMAGE_TAG:-dev}
  build:
    context: ./backend
  # Live reads ./.env; the isolated test stack points this at compose.test.env.
  env_file:
    - path: ${APP_ENV_FILE:-./.env}
      required: false
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    NEO4J_URI: bolt://neo4j:7687
    # App-level switch for graph migrations. Keep in sync with the `graph`
    # profile: COMPOSE_PROFILES contains `graph` <=> NEO4J_ENABLED=true.
    NEO4J_ENABLED: ${NEO4J_ENABLED:-false}
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: http://minio:9000
  mem_limit: 1g
  restart: unless-stopped
  depends_on: *infra-deps

services:
  # --------------------------- Infrastructure ------------------------------
  postgres:
    image: postgres:17
    mem_limit: 1g
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Real query, not a port check.
      test: ["CMD-SHELL", "psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    mem_limit: 2g
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_HOST_PORT:-17474}:7474" # HTTP browser
      - "127.0.0.1:${NEO4J_BOLT_HOST_PORT:-17687}:7687" # Bolt
    environment:
      # Do NOT expose NEO4J_PASSWORD as its own variable: the image maps every
      # NEO4J_* env var to a Neo4j setting, and strict validation rejects the
      # resulting "password" setting. The healthcheck derives the password from
      # NEO4J_AUTH instead.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?}
      # Keep the JVM inside the 2g container limit: heap 1g + pagecache 512m
      # (+ ~300m JVM overhead). The image maps NEO4J_* env vars to settings and
      # doubles literal underscores, so `heap_max__size` -> `heap.max_size`.
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # Real Cypher query over the HTTP API. Do NOT use cypher-shell here: it
      # starts a JVM per check; under load checks time out, Docker does not kill
      # them, and they pile up (seen 2026-09-30: dozens of JVMs, 7 GB, 790% CPU).
      # NEO4J_AUTH is "neo4j/<password>"; $${NEO4J_AUTH#*/} recovers the password.
      test:
        - CMD-SHELL
        - >-
          wget -qO- -T 8
          --header='Content-Type: application/json'
          --header="Authorization: Basic $$(printf 'neo4j:%s' "$${NEO4J_AUTH#*/}" | base64)"
          --post-data='{"statements":[{"statement":"RETURN 1"}]}'
          http://localhost:7474/db/neo4j/tx/commit
          | grep -q '"errors":\[\]'
      interval: 15s
      timeout: 10s
      retries: 20
      # A fresh volume on a busy host took 5.5 min to start (2026-09-30).
      start_period: 300s

  redis:
    image: redis:7
    profiles: ["queue"]
    mem_limit: 256m
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      # PING must answer (exit 0 with PONG).
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    # The official minio/minio image no longer exists; this is Chainguard's
    # maintained build, pinned by digest for reproducibility.
    image: cgr.dev/chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9
    mem_limit: 1g
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-19000}:9000" # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19001}:9001" # console
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
    volumes:
      - minio_data:/data
    healthcheck:
      # The image ships sh + mc but no curl/wget. `mc ready` performs an actual
      # readiness call against the local server.
      test:
        [
          "CMD-SHELL",
          "MC_HOST_local=http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@localhost:9000 mc ready local",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # --------------------------- Applications --------------------------------
  api:
    <<: *backend-base
    depends_on: *app-deps
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Core scheduler: one continuous process (calendar sync + release refresh).
  # Default profile, so it starts with `docker compose up -d`. It writes a
  # heartbeat file after every tick; the healthcheck fails when the file is
  # missing or older than 3 ticks (CORE_TICK_MINUTES, default 15). The host can
  # sit near 100% CPU, so the timings are deliberately generous.
  core-scheduler:
    <<: *backend-base
    depends_on: *app-deps
    command: ["python", "-m", "app.core.scheduler"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, sys, time;
          path = os.environ.get('CORE_HEARTBEAT_PATH', '/tmp/core-scheduler.heartbeat');
          limit = int(os.environ.get('CORE_TICK_MINUTES', '15')) * 60 * 3;
          fresh = os.path.exists(path) and (time.time() - os.path.getmtime(path)) <= limit;
          sys.exit(0 if fresh else 1)
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s

  # Celery worker — implemented in a later task (code does not exist yet).
  worker:
    <<: *backend-base
    depends_on: *app-deps
    profiles: ["queue"]
    command: ["python", "-c", "print('worker: not implemented yet'); raise SystemExit(1)"]

  # Celery beat — implemented in a later task (code does not exist yet).
  beat:
    <<: *backend-base
    profiles: ["queue"]
    mem_limit: 512m
    command: ["python", "-c", "print('beat: not implemented yet'); raise SystemExit(1)"]
    depends_on: *app-deps

  # Schema migrator: runs once (postgres -> neo4j if enabled -> minio) and
  # exits 0. Application services wait for it via
  # `service_completed_successfully`. One-shot: never restarted.
  migrator:
    <<: *backend-base
    restart: "no"
    command: ["python", "-m", "app.migrator"]

  frontend:
    image: karven-frontend:dev
    build:
      context: ./frontend
    profiles: ["web"]
    mem_limit: 1536m
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-13000}:3000"
    environment:
      # Windows bind mounts do not emit reliable inotify events.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep image-installed deps / build output out of the bind mount.
      - /app/node_modules
      - /app/.next
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      # next dev renders on demand; node startup + render can exceed 5 s on a busy host.
      timeout: 15s
      retries: 20
      start_period: 90s

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  minio_data:
