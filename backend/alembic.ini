# Alembic configuration for the PostgreSQL schema.
#
# There is intentionally no sqlalchemy.url here: migrations/postgres/env.py
# builds the URL from app.config.settings (which reads the root .env).

[alembic]
# %(here)s is the directory containing this ini file (backend/).
script_location = %(here)s/migrations/postgres
# Readable sequential revision file names, e.g. 0001_initial.py.
# Pass --rev-id 0001 explicitly when creating revisions.
file_template = %%(rev)s_%%(slug)s
# Make the `app` package importable regardless of the working directory.
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
