# Kavram ağacı — v2.1 (Task 2.1, kullanıcı onaylı 2026-10-04)
# v2'den sonra Opus 5.5 ve Codex gpt-6-astra incelemeleriyle gözden geçirildi (2026-10-04).
#
# KURALLAR (DECISIONS §7)
# - Atanabilir etiket = yaprak (alt dal). Ana dallar gezinme grubudur; veri setine yaprak
#   atanınca ana dal otomatik devralınır. Jev önce ana dalları, sonra yalnız geçen ana
#   dalların yapraklarını puanlar.
# - Veri seti 1-3 yaprak etiketi alır. Kapsam üçü aşarsa etiket sessizce kesilmez: veri
#   seti inceleme kuyruğuna gider. Çok konulu derlemeler (ör. Turcat IMF SDDS) istisnadır:
#   yalnız ana dal düzeyinde, sınırsız ana dal etiketi alırlar ve cok_konulu_derleme
#   bayrağı taşırlar. Arama kodu geçen yaprakları VE geçen ana dalı doğrudan taşıyan
#   (yalnız ana dal etiketli) veri setlerini getirir; sonra ölçü koduyla doğrulanır.
#   İstisna kapsamı: Turcat (IMF SDDS) ve TCMB Piyasa Katılımcıları Anketi (tanımsal
#   istatistikler TÜFE, faiz, kur, cari denge beklentilerini birlikte taşır).
# - Birincil/ikincil: "degildir" listesi hedef etiketi ve gerekçeyi gösterir ve BİRİNCİL
#   etiketi belirler. Komşu etiket ikincil olarak 1-3 sınırı içinde eklenebilir; arama
#   geçen etiketlerden herhangi birini aradığı için eksik ikincil etiket kaçırmaya,
#   fazla ikincil etiket yalnız gürültüye yol açar.
# - Beklenti/anket: anketin konusu konu etiketidir (ör. enflasyon beklentisi =
#   tuketici_fiyatlari + data_nature=beklenti; anket kimliği birincil olarak
#   guven_beklenti_anketleri altında).
# - Etiket alanları: konu (bu dosya), ölçüm türü, veri niteliği. Coğrafya, sektör, sıklık,
#   kurum, para birimi, vade, alış/satış, reel/nominal, ürün sınıflaması ETİKET DEĞİLDİR:
#   katalog meta bilgisi veya kırılım (boyut kodu) olarak çözülür.
# - Meta bayrakları (etiket değil): revizyon_tablosu, mevsim_arindirilmis, para_birimi,
#   nominal_mi, donem_serisi (aynı kavramın kopuk dönem serisi, ör. sektör bilançoları
#   2009-2023 / 2023-2025), arsiv, cok_konulu_derleme. Bayrakların bugün DB'de dolu olmadığı
#   doğrulandı (2026-10-04): Task 2.2 bunları kaynak meta bilgisinden doldurur ve kabul
#   kriterine girer. nace_surumu kaynakta doğrulanırsa eklenir. Aynı veri seti içinde değişebilen
#   bayraklar (para birimi, nominal/reel, mevsim arındırması, gerçekleşen/beklenti)
#   ölçü kodu veya seri düzeyinde çözülür; veri seti içerdiği değerlerin kümesini taşır.
#   revizyon_tablosu YALNIZ eski sürümleri sunan tablodur (revize edilen normal veri seti
#   değildir) ve varsayılan aramadan dışlanır; güncel serinin revizyon geçmişi ayrıdır.
# - Veri niteliği (gerçekleşen/beklenti/tahmin) de ölçü kodu düzeyindedir: anket veri
#   setleri aynı anda gerçekleşen ve beklenti soruları içerir; veri seti değer kümesini taşır.
# - Ölçüm türü ölçü boyutu kodu (veya seri) düzeyindedir; veri seti yalnız içerdiği türlerin
#   kümesini taşır. Kodlar bir kez türe eşlenir, Jev tür etiketlemez (§8 için türden
#   toplama kuralı gelir: bkz. measure_types.toplama). Toplama değerleri: toplam,
#   ortalama, donem_sonu, yeniden_hesapla (yüzde değişim: ham seviyeden hedef döneme göre
#   yeniden hesaplanır, ortalaması alınmaz; seviye yoksa seri eşleştirmeden çıkar),
#   test_disi (ağırlık, katkı, dağılım istatistiği gibi test edilecek seri değildir). Kümülatif akım
#   serileri toplamadan önce dönemlik değere çevrilir.
# - Uluslararası karşılaştırma dalı yoktur: IMF/OECD/yabancı ülke verisi konusuna göre
#   etiketlenir; ülke kırılım/kurum meta bilgisindedir.
# - Boş yapraklar (katalogda veri seti olmayan) normaldir: talep üzerine çekilecek veri
#   için tutulur. Jev'in yüksek puan verip "güçlü eşleşme yok" sonucu çıkması Task 2.6
#   ölçümünde ayrıca izlenir.
# - degildir: [{id: <topics içinde var olan id>, ne: <gerekçe>}]; id bütünlüğü testle denetlenir.
# - Kanıt: 2026-10-04 katalog (883 veri seti: TÜİK 616, TCMB 243, HMB 24).

version: 2.1
status: approved   # kullanıcı onayı 2026-10-04

topics:
  - id: fiyatlar_enflasyon
    ad: Fiyatlar ve enflasyon
    tanim: Mal ve hizmet fiyat endeksleri, fiyat düzeyi karşılaştırmaları ve bunların değişimi.
    degildir:
      - {id: konut_fiyatlari, ne: Konut varlığı satış fiyatları burada sınıflanmaz.}
      - {id: nominal_kurlar, ne: Döviz fiyatı kur dalındadır.}
      - {id: insaat_maliyet, ne: İnşaat maliyet endeksi birincil olarak konut_insaat_gayrimenkul'dadır; fiyatlar ikincil olabilir.}
    children:
      - {id: tuketici_fiyatlari, ad: Tüketici fiyatları, tanim: "TÜFE manşet, çekirdek göstergeler, ana harcama grupları, özel kapsamlı göstergeler, TÜFE kira alt endeksi ve tüketici/enflasyon beklentileri (beklenti anketi birincil olarak guven_beklenti_anketleri'nde)."}
      - {id: uretici_fiyatlari, ad: Üretici fiyatları, tanim: "Yurt içi ve yurt dışı ÜFE, hizmet ÜFE, sektörel üretici fiyatları."}
      - {id: tarimsal_fiyatlar, ad: Tarımsal fiyatlar, tanim: "Tarımsal girdi ve üretici fiyat endeksleri."}
      - {id: gecinme_bolgesel_fiyat, ad: Geçinme ve bölgesel fiyatlar, tanim: "Geçinme endeksleri ve il/bölge bazlı fiyat göstergeleri; kira kapsamı hariç."}
      - {id: birim_deger, ad: Dış ticaret birim değerleri, tanim: "İhracat/ithalat birim değer endeksleri (miktar endeksleri ve dış ticaret haddi dis_ticaret_endeks'te)."}
      - {id: satin_alma_gucu_paritesi, ad: Satın alma gücü paritesi, tanim: "SGP, ülkeler/bölgeler arası fiyat düzeyi endeksleri ve SGP bazlı karşılaştırmalar."}

  - id: doviz_kurlari
    ad: Döviz kurları
    tanim: Yabancı paraların TL ve çapraz karşılığı, efektif ve reel efektif kurlar.
    degildir:
      - {id: firma_doviz_pozisyonu, ne: Reel sektör döviz varlık/yükümlülüğü firmalar dalındadır.}
      - {id: piyasa_katilimcilari, ne: Kur beklentisi anketi anket dalındadır; nominal_kurlar ikincil olabilir.}
    children:
      - {id: nominal_kurlar, ad: Nominal kurlar, tanim: "TCMB alış/satış/efektif kurları, piyasa kurları, çapraz kurlar; kur beklenti anketleri yalnız ikincil olarak (birincil piyasa_katilimcilari)."}
      - {id: reel_efektif_kur, ad: Reel efektif kur, tanim: "TÜFE/ÜFE bazlı reel efektif döviz kuru endeksleri."}
      - {id: kur_sepetleri, ad: Kur sepetleri, tanim: "Döviz sepeti ve dolar/euro bileşik göstergeleri."}

  - id: faiz_para_politikasi
    ad: Faiz ve para politikası
    tanim: Politika faizi, piyasa faizleri, banka faiz oranları ve TCMB para piyasası işlemleri.
    degildir:
      - {id: krediler, ne: Kredi tutarları faiz değildir.}
      - {id: devlet_borclanma, ne: Devlet tahvil fiyat/getirisi ve ihale sonuçları piyasa dalındadır.}
    children:
      - {id: politika_faizleri, ad: Politika ve kısa vade faizleri, tanim: "TCMB politika faizi, faiz koridoru, ağırlıklı fonlama maliyeti (oranlar; işlem hacimleri para_piyasasi_islemleri'nde)."}
      - {id: para_piyasasi_islemleri, ad: Para piyasası işlemleri, tanim: "TCMB repo/ters repo, swap ve depo işlemleri, bankalararası para piyasası, gün başı likidite, net fonlama, döviz alım-satım ve müdahale işlemleri (hacimler)."}
      - {id: mevduat_faizleri, ad: Mevduat faizleri, tanim: "Banka mevduat faiz oranları."}
      - {id: kredi_faizleri, ad: Kredi faizleri, tanim: "Ticari, tüketici, konut, taşıt ve kart kredisi faiz oranları, azami faizler."}
      - {id: reeskont_avans, ad: Reeskont ve avans faizleri, tanim: "TCMB reeskont ve avans işlem faiz oranları."}

  - id: para_kredi_bankacilik
    ad: Para, kredi ve bankacılık
    tanim: Para arzı, mevduat ve kredi tutarları, banka ve merkez bankası bilançoları, ödeme sistemleri.
    degildir:
      - {id: mevduat_faizleri, ne: Faiz oranları faiz dalındadır.}
      - {id: finansal_hesaplar, ne: S.121 (TCMB) sektör finansal hesapları ulusal hesaplardadır.}
      - {id: yapisal_is_istatistikleri, ne: Bankaların/aracı kurumların istihdam, ciro ve yatırım gibi yapısal iş istatistikleri.}
    children:
      - {id: parasal_buyuklukler, ad: Parasal büyüklükler, tanim: "M1/M2/M3 para arzı, tedavüldeki banknotlar."}
      - {id: mevduat, ad: Mevduat ve katılım fonları, tanim: "Banka mevduat ve katılım fonu tutarları, zorunlu karşılığa tabi yükümlülükler."}
      - {id: krediler, ad: Krediler, tanim: "Tüketici, ticari, konut, taşıt, kart kredisi tutarları, takipteki krediler."}
      - {id: merkez_bankasi_bilancosu, ad: Merkez bankası bilançosu, tanim: "TCMB analitik bilançosu ve haftalık vaziyet."}
      - {id: banka_bilancolari, ad: Banka bilançoları, tanim: "Bankacılık sektörü bilanço kalemleri."}
      - {id: odeme_sistemleri, ad: Ödeme sistemleri ve kartlar, tanim: "Kart harcamaları, havale/EFT, ödeme sistemi işlem hacimleri."}
      - {id: banka_disi_finansal, ad: Banka dışı finansal kuruluşlar, tanim: "Finansman, faktoring, leasing şirketlerinin finansal verileri."}

  - id: finansal_piyasalar
    ad: Finansal piyasalar ve menkul kıymetler
    tanim: Hisse senedi, tahvil/bono, altın ve piyasa göstergeleri (fiyat, getiri, hacim, yabancı payı).
    degildir:
      - {id: mevduat, ne: Mevduat tutarları bankacılık dalındadır.}
      - {id: krediler, ne: Kredi tutarları bankacılık dalındadır.}
      - {id: sigorta, ne: Sigorta ayrı dalda.}
      - {id: bireysel_emeklilik, ne: BES ayrı dalda.}
      - {id: rezervler, ne: Resmi rezerv altını ödemeler dengesi dalındadır.}
      - {id: dis_borc, ne: Yurt dışında ihraç edilen borçlanma senedi dış borçtur.}
    children:
      - {id: hisse_senedi, ad: Hisse senedi ve borsa, tanim: "BIST endeksleri, işlem hacmi, piyasa değeri."}
      - {id: devlet_borclanma, ad: Devlet iç borçlanma senetleri, tanim: "DİBS fiyat, getiri ve ihale sonuçları."}
      - {id: ozel_sektor_borclanma, ad: Özel sektör borçlanma senetleri, tanim: "Özel sektör tahvil/bono ve sürdürülebilir (ESG) borçlanma senetleri."}
      - {id: yabanci_portfoy, ad: Yurt dışı yerleşik portföyü, tanim: "TCMB haftalık menkul kıymet istatistikleri: yurt dışı yerleşiklerin hisse ve DİBS stokları ve haftalık değişimi. Ödemeler dengesi portföy akımı ve UYP stoku hariç."}
      - {id: altin_kiymetli_maden, ad: Altın ve kıymetli madenler (piyasa), tanim: "Kıymetli maden piyasa fiyatı ve işlemleri; resmi rezerv altını hariç."}
      - {id: menkul_kiymet_istatistik, ad: Menkul kıymet istatistikleri, tanim: "İhraç ve stok menkul kıymet istatistikleri."}
      - {id: yatirim_araci_getirileri, ad: Yatırım araçları getirileri, tanim: "Altın, döviz, mevduat, borsa gibi yatırım araçlarının dönemsel nominal/reel getirileri."}

  - id: sigorta_emeklilik
    ad: Sigorta ve bireysel emeklilik
    tanim: Sigorta ve bireysel emeklilik sistemi istatistikleri.
    degildir:
      - {id: yapisal_is_istatistikleri, ne: Finansal aracı kurumların yapısal iş istatistikleri (TÜİK Financial Intermediary Institution) iş istatistikleri dalındadır.}
      - {id: banka_bilancolari, ne: Banka bilançoları bankacılık dalındadır.}
    children:
      - {id: sigorta, ad: Sigorta, tanim: "Hayat/hayat dışı sigorta prim, tazminat ve sektör göstergeleri."}
      - {id: bireysel_emeklilik, ad: Bireysel emeklilik, tanim: "BES fon büyüklüğü ve katılımcı sayıları."}

  - id: odemeler_dengesi_dis_finansman
    ad: Ödemeler dengesi ve dış finansman
    tanim: Cari işlemler, finans hesabı, rezervler, uluslararası yatırım pozisyonu ve dış borç.
    degildir:
      - {id: ihracat_ithalat, ne: Mal dış ticareti detayı dış ticaret dalındadır.}
      - {id: butce, ne: Bütçe tarafı kamu maliyesindedir.}
    children:
      - {id: cari_islemler, ad: Cari işlemler, tanim: "Cari denge; mal, hizmet, gelir ve cari transfer kalemleri (hizmet ticareti toplu hesabı dahil)."}
      - {id: dogrudan_yatirim, ad: Doğrudan yatırımlar, tanim: "Yurt dışından/dışına doğrudan yatırım akım ve stokları."}
      - {id: portfoy_yatirim, ad: Portföy yatırımları, tanim: "Ödemeler dengesi portföy yatırımı akımları."}
      - {id: diger_yatirimlar, ad: Diğer yatırımlar, tanim: "Yalnız ödemeler dengesi finans hesabı tablosunda kredi, mevduat ve ticari kredi gibi diğer yatırım işlemleri."}
      - {id: rezervler, ad: Uluslararası rezervler, tanim: "TCMB brüt/net rezervleri, resmi rezerv altını dahil."}
      - {id: uly_pozisyon, ad: Uluslararası yatırım pozisyonu, tanim: "Net UYP, varlık ve yükümlülük stokları, portföy varlıklarının coğrafi dağılımı, yurt dışı yerleşik mevduatları. UYP tablolarında (stok) bu etiket birincildir; doğrudan yatırım stoku için dogrudan_yatirim ikincil olabilir."}
      - {id: dis_borc, ad: Dış borç, tanim: "Yerleşiklerin yerleşik olmayanlara brüt dış borç stoku, kısa vadeli dış borç, özel sektörün yurt dışından kredi borcu, kredi kullanımı/geri ödemesi (anapara/faiz), borç çevirme oranları, yurt dışında ihraç edilen borçlanma senetleri. Borçlu kamuysa kamu_borc da ikincil atanabilir."}

  - id: dis_ticaret
    ad: Dış ticaret
    tanim: Mal ve hizmetlerin sınır ötesi ticareti; tutar, miktar ve denge göstergeleri.
    degildir:
      - {id: birim_deger, ne: Birim değer endeksi fiyat dalındadır.}
      - {id: cari_islemler, ne: Ödemeler dengesi hizmet hesabı toplu olarak cari işlemlerdedir.}
      - {id: iktisadi_yonelim, ne: Anketlerin mal grubu kırılımları (ara/yatırım/tüketim malı) dış ticaret değildir.}
    children:
      - {id: ihracat_ithalat, ad: İhracat ve ithalat, tanim: "Mal ihracatı ve ithalatı toplamları, ürün (BEC/ISIC/CPA) ve ülke kırılımları."}
      - {id: dis_ticaret_dengesi, ad: Dış ticaret dengesi, tanim: "İhracat-ithalat dengesi, karşılama oranı."}
      - {id: dis_ticaret_endeks, ad: Dış ticaret miktar endeksleri ve haddi, tanim: "Miktar endeksleri ve dış ticaret haddi (birim değer endeksleri fiyatlar_enflasyon.birim_deger'de)."}
      - {id: hizmet_ticareti, ad: Hizmet ticareti, tanim: "Hizmet türü ve ortak ülke kırılımında hizmet ihracatı/ithalatı."}

  - id: ulusal_hesaplar_buyume
    ad: Ulusal hesaplar ve büyüme
    tanim: GSYH ve bileşenleri, kurumsal sektör hesapları, verimlilik, öncü göstergeler.
    degildir:
      - {id: uretim_endeksleri, ne: Sanayi/hizmet üretim endeksleri üretim dalındadır.}
      - {id: ekonomik_guven, ne: Güven endeksleri anket dalındadır.}
    children:
      - {id: gsyh, ad: GSYH, tanim: "Üretim, harcama ve gelir yöntemiyle GSYH ve katma değer; ulusal ve bölgesel düzey (bölge kırılımdır)."}
      - {id: tuketim_yatirim, ad: Nihai tüketim ve yatırım, tanim: "Hanehalkı/kamu nihai tüketimi, sabit sermaye oluşumu."}
      - {id: finansal_hesaplar, ad: Kurumsal sektör finansal hesapları, tanim: "S.1, S.11, S.12, S.121, S.13 (S.1311/1313/1314), S.14 sektörlerinin finansal varlık/yükümlülük akım ve stokları, konsolide ve konsolide olmayan; şirket muhasebe bilançosu değildir. Genel yönetim alt sektörleri için genel_yonetim_hesaplari ikincil olabilir."}
      - {id: verimlilik, ad: Verimlilik, tanim: "Emek ve toplam faktör verimliliği."}
      - {id: onculer, ad: Bileşik öncü göstergeler, tanim: "Bileşik öncü göstergeler endeksi."}

  - id: sanayi_uretim_is_dunyasi
    ad: Sanayi, üretim ve iş dünyası
    tanim: Üretim hacmi, kapasite, ciro ve işletme istatistikleri.
    degildir:
      - {id: firma_bilancolari, ne: Firma bilançoları firmalar dalındadır.}
      - {id: iktisadi_yonelim, ne: Anket cevap dağılımları anket dalındadır.}
    children:
      - {id: uretim_endeksleri, ad: Üretim ve satış hacim endeksleri, tanim: "Sanayi, inşaat ve hizmet üretim endeksleri, ticaret satış hacim endeksi."}
      - {id: kapasite_kullanimi, ad: Kapasite kullanımı, tanim: "İmalat sanayi kapasite kullanım oranı (anketle ölçülse de bu etiket birincildir; güven endeksi değildir)."}
      - {id: ciro_endeksleri, ad: Ciro endeksleri, tanim: "Sanayi/ticaret/hizmet ciro endeksleri."}
      - {id: yapisal_is_istatistikleri, ad: Yapısal iş istatistikleri, tanim: "İşletme sayısı stoku (Business Registers, CİP girişim sayıları), çalışan, ciro, katma değer, yatırım (SBS); finansal aracı kurumlar ve bankaların yapısal iş istatistikleri dahil; bilanço değildir."}
      - {id: girisimcilik, ad: Girişimcilik ve iş demografisi, tanim: "Girişim doğuşu/ölümü, hayatta kalma, yüksek büyüme gösteren girişimler; işletme sayısı stoku yapisal_is_istatistikleri'nde."}

  - id: isgucu_istihdam_ucretler
    ad: İşgücü, istihdam ve ücretler
    tanim: İşsizlik, istihdam, işgücüne katılım, ücretler.
    degildir:
      - {id: sosyal_koruma, ne: Sosyal güvenlik ödemeleri sosyal koruma dalındadır.}
      - {id: egitim, ne: Mezun istihdamı ve ilk iş bulma süresi eğitim dalındadır.}
      - {id: iktisadi_yonelim, ne: Anketin çalışan sayısı ölçeği kırılımları işgücü verisi değildir.}
    children:
      - {id: issizlik, ad: İşsizlik, tanim: "İşsizlik oranları, atıl işgücü, işsiz sayısı."}
      - {id: istihdam, ad: İstihdam, tanim: "İstihdam edilen sayısı, sektörel istihdam, kayıtlı çalışan sayısı."}
      - {id: isgucu_katilim, ad: İşgücüne katılım, tanim: "İşgücüne katılım oranı, işgücü piyasası göstergeleri."}
      - {id: ucretler, ad: Ücretler ve asgari ücret, tanim: "Ortalama ücret, işgücü maliyeti, asgari ücret."}

  - id: kamu_maliyesi
    ad: Kamu maliyesi
    tanim: Bütçe, vergi, kamu borç stoku ve genel yönetim bütçe dengesi.
    degildir:
      - {id: dis_borc, ne: Brüt dış borcun ödemeler dengesi görünümü ödemeler dengesi dalındadır; kamu kısmı için ikincil atanır.}
