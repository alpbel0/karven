      - {id: adalet_guvenlik, ad: Adalet ve güvenlik, tanim: "Suç, mahkûm ve adalet istatistikleri."}

# ÖLÇÜM TÜRÜ — ölçü boyutu kodu (veya seri) düzeyinde; veri seti içerdiği türlerin kümesini taşır.
# toplama = frekans eşleştirmede (§8) düşük frekansa indirme kuralı.
measure_types:
  - {id: akim_tutar, ad: Akım tutarı, toplama: toplam, tanim: "Dönem boyunca oluşan parasal tutar (ihracat, satış tutarı)."}
  - {id: stok_tutar, ad: Stok tutarı, toplama: donem_sonu, tanim: "Belirli tarihte mevcut parasal tutar (mevduat, borç stoku, rezerv)."}
  - {id: akim_adet, ad: Akım adedi, toplama: toplam, tanim: "Dönem boyunca oluşan adet (konut satışı, doğum)."}
  - {id: stok_adet, ad: Stok adedi, toplama: donem_sonu, tanim: "Belirli tarihte mevcut adet (nüfus, araç sayısı)."}
  - {id: fiziksel_akim, ad: Fiziksel akım, toplama: toplam, tanim: "Dönem boyunca oluşan fiziksel miktar (kWh elektrik tüketimi, ton atık, su çekimi)."}
  - {id: fiziksel_stok, ad: Fiziksel stok, toplama: donem_sonu, tanim: "Belirli tarihte mevcut fiziksel büyüklük (tarım alanı, kurulu güç, hayvan varlığı)."}
  - {id: fiyat_kur, ad: Fiyat / kur, toplama: ortalama, tanim: "Bir birim mal/hizmet/dövizin fiyatı."}
  - {id: endeks, ad: Endeks, toplama: ortalama, tanim: "Baz dönemine göre endeks değeri."}
  - {id: aylik_yuzde_degisim, ad: Aylık % değişim, toplama: yeniden_hesapla, tanim: "Önceki aya göre yüzde değişim."}
  - {id: donemsel_yuzde_degisim, ad: Dönemsel % değişim, toplama: yeniden_hesapla, tanim: "Önceki eş uzunluktaki döneme göre yüzde değişim (çeyreklik vb.)."}
  - {id: yillik_yuzde_degisim, ad: Yıllık % değişim, toplama: yeniden_hesapla, tanim: "Önceki yılın aynı dönemine göre yüzde değişim."}
  - {id: yilbasindan_yuzde_degisim, ad: Yılbaşından % değişim, toplama: test_disi, tanim: "Yıl başından bu yana kümülatif yüzde değişim."}
  - {id: on_iki_ay_ort_yuzde_degisim, ad: 12 aylık ortalama % değişim, toplama: yeniden_hesapla, tanim: "Son 12 ay ortalamasının önceki 12 aya göre yüzde değişimi."}
  - {id: oran_pay, ad: Oran / pay, toplama: ortalama, tanim: "Oran, pay veya yüzde değer (işsizlik oranı, faiz)."}
  - {id: katki_puan, ad: Katkı (puan), toplama: test_disi, tanim: "Bir kalemin toplam değişime yüzde puan katkısı."}
  - {id: agirlik, ad: Ağırlık, toplama: test_disi, tanim: "Sepet/endeks kalem ağırlığı."}
  - {id: hiz_binde, ad: Hız (binde/yüz binde), toplama: ortalama, tanim: "Kaba doğum/ölüm hızı gibi binde veya yüz binde oranlar."}
  - {id: sure, ad: Süre, toplama: ortalama, tanim: "Gün, ay, yıl cinsinden süre (beklenen yaşam, ilk iş bulma süresi)."}
  - {id: kisi_basina, ad: Kişi başına, toplama: ortalama, tanim: "Kişi başına düşen değer."}
  - {id: dagilim_istatistigi, ad: Dağılım istatistiği, toplama: test_disi, tanim: "Standart sapma, en büyük/en küçük, medyan gibi dağılım özetleri (ör. PKA)."}
  - {id: katilimci_sayisi, ad: Katılımcı sayısı, toplama: test_disi, tanim: "Ankete yanıt veren sayısı (gözlem sayısı)."}
  - {id: cevap_dagilimi, ad: Cevap dağılımı, toplama: ortalama, tanim: "Anket cevaplarının yüzde dağılımı."}
  - {id: denge_yayilma, ad: Denge / yayılma değeri, toplama: ortalama, tanim: "Anketlerde olumlu-olumsuz fark (denge) veya yayılma."}

