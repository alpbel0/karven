# Catalog search test set (Task 2.6, DECISIONS §7).
#
# Each query is what the first agent would send to ``find_series``. ``expected`` is
# the list of ACCEPTABLE series (user decision 2026-10-05, option B): the query
# succeeds when a ``strong`` result matches ANY entry. An entry matches a result
# when institution and dataset are equal and every code listed in ``codes`` equals
# the result's code for that dimension (an entry without ``codes`` accepts any
# series of the dataset).
#
# group: haber  = phrased from real news in ``news_articles`` (2026-10-03..05)
#        agac   = written from the concept tree to cover branches the news skips
#        olumsuz = data the catalog does NOT hold; expected is empty and a strong
#                  result counts as a false positive (reported apart from the hit rate)
#
# Corrections made after seeing run 1 are marked "added after run 1"; the report
# prints the score before and after them (``outcome_at_run``), so the first,
# pre-registered number is never lost.
#
# ``python -m app.catalog.search_eval validate`` checks every entry against the
# live catalog, so a typo or a removed dataset cannot silently lower the score.

version: 1
# Success threshold on the hit rate of the positive groups (user decision #4,
# 2026-10-05: 70%).
threshold: 0.70

